
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gulf News e‑Invoicing Information</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0;padding:40px;display:flex;justify-content:center}
.form-container{background:#fff;padding:30px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.1);width:100%;max-width:850px;display:none}
.form-group{margin-bottom:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}
label{font-weight:bold;display:block;margin-bottom:4px}.help{font-size:12px;color:#6c757d;font-style:italic;margin-bottom:5px}
input,select{width:100%;padding:10px;box-sizing:border-box;border:1px solid #ccc;border-radius:4px}
input[readonly]{background:#e9ecef}
button{background:#0078d4;color:#fff;border:none;padding:12px;border-radius:4px;cursor:pointer}
#submitBtn{width:100%}.counter{text-align:right;font-size:11px;color:#777}.error{display:none;color:#dc3545;font-size:12px}.invalid{border-color:#dc3545}
.status{display:none;padding:12px;border-radius:4px;margin-bottom:15px}.ok{background:#d1e7dd}.bad{background:#f8d7da}.info{background:#e7f3ff}
.captcha{display:flex;gap:10px;align-items:center}.capbox{padding:10px 14px;background:#eee;letter-spacing:4px;font-weight:bold}
#loadingScreen{position:fixed;inset:0;background:#f4f6f9;display:flex;align-items:center;justify-content:center} 
#errorScreen{display:none}
</style>
</head>
<body>
<div id="loadingScreen">Loading customer information...</div>
<div id="errorScreen">Unable to load customer information.</div>
<div class="form-container" id="formContainer">
<h2>Gulf News e‑Invoicing Information</h2>
<div id="status" class="status"></div>
<form id="customerForm">
<div class="row">
<div class="form-group"><label>Internal Reference *</label><input id="ReferenceCode" readonly maxlength="10"></div>
<div class="form-group"><label>Customer Name *</label><div class='help'>Registered legal entity name.</div><input id="custName" maxlength="80"><div class='counter' id='custNameCounter'></div></div>
</div>
<div class="row">
<div class="form-group"><label>Email *</label><input id="custemail" type="email" maxlength="50"></div>
<div class="form-group"><label>Contact Number *</label><input id="contactNumber" maxlength="20"></div>
</div>
<div class="row">
<div class="form-group"><label>TIN *</label><input id="tin" maxlength="10"><div id='tinError' class='error'></div></div>
<div class="form-group"><label>TRN *</label><input id="trn" maxlength="15"><div id='trnError' class='error'></div></div>
</div>
<div class="row">
<div class="form-group"><label>Trade Licence Number</label><input id="tradeLicenceNumber" maxlength="30"></div>
<div class="form-group"><label>Trade License Issuing Authority</label><input id="tradeAuthority" maxlength="50"><div id='tradeAuthorityError' class='error'></div></div>
</div>
<div class="form-group"><label>Emirate *</label><select id='emirate'><option value=''>Select</option><option>Abu Dhabi</option><option>Dubai</option><option>Sharjah</option><option>Ajman</option><option>Umm Al Quwain</option><option>Ras Al Khaimah</option><option>Fujairah</option></select></div>
<div class="form-group"><label><input style='width:auto' type='checkbox' id='freeZoneCustomer'> Free Zone Based Customer</label></div>
<div class='form-group'><label>Address Line 1 *</label><input id='address1' maxlength='100'></div>
<div class='form-group'><label>Address Line 2 *</label><input id='address2' maxlength='35'></div>
<div class='form-group'><label>Address Line 3</label><input id='address3' maxlength='35'></div>
<div class='form-group'><div class='captcha'><div id='captchaCode' class='capbox'></div><button type='button' onclick='generateCaptcha()'>Refresh</button></div><input id='captchaInput' maxlength='6' placeholder='Enter captcha'><div id='captchaInputError' class='error'></div></div>
<div class='form-group'><label><input style='width:auto' type='checkbox' id='beneficiaryConfirmation'> I confirm that I am the beneficiary of the services provided.</label></div>
<button id='submitBtn' type='submit'>Submit Responses</button>
</form></div>
<script>
const lookupFlowUrl="https://default2aff9a6f941d427ebc3e6b8404db8d.2d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/29/workflows/4e8e1b92cf514852961ad5198594bfae/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=w0aeVQBZY4I_cF5R-YT5JAQen9_c7zNvoYNhlISiCiA";
const flowUrl="https://default2aff9a6f941d427ebc3e6b8404db8d.2d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/26/workflows/64cb3b7ca0e84c91be751ca176869c19/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=H6YVvurcmnBRUPZi4Zy-DWBEZLQr8XobfeJcP_v6_zU;"
let cap=''; function generateCaptcha(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';cap='';for(let i=0;i<6;i++) cap+=c[Math.floor(Math.random()*c.length)];captchaCode.innerText=cap;} generateCaptcha();
function statusMsg(m,t){status.className='status '+t;status.style.display='block';status.innerText=m;}
function err(id,m){let e=document.getElementById(id+'Error'); if(e){e.style.display='block';e.innerText=m;document.getElementById(id).classList.add('invalid');}}
function clearErr(){document.querySelectorAll('.error').forEach(x=>x.style.display='none');document.querySelectorAll('.invalid').forEach(x=>x.classList.remove('invalid'));}
const ref=new URLSearchParams(location.search).get('ref'); if(ref) ReferenceCode.value=ref;
fetch(lookupFlowUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({referenceCode:ref})}).then(r=>r.json()).then(d=>{custName.value=d.customerName||'';custemail.value=d.customerEmail||'';tin.value=d.tin||'';trn.value=d.trn||'';emirate.value=d.emirate||'';contactNumber.value=d.contactNumber||'';tradeLicenceNumber.value=d.tradeLicenceNumber||'';tradeAuthority.value=d.tradeAuthority||'';address1.value=d.address1||'';address2.value=d.address2||'';address3.value=d.address3||'';freeZoneCustomer.checked=d.freeZoneCustomer||false;loadingScreen.style.display='none';formContainer.style.display='block';statusMsg('Customer information loaded.','ok');}).catch(()=>{loadingScreen.style.display='none';errorScreen.style.display='block';});
customerForm.addEventListener('submit',async e=>{e.preventDefault();clearErr();let ok=true;if(!/^\d{10}$/.test(tin.value)){err('tin','TIN must contain exactly 10 digits');ok=false;} if(!/^\d{15}$/.test(trn.value)){err('trn','TRN must contain exactly 15 digits');ok=false;} if(tradeLicenceNumber.value&&!tradeAuthority.value){err('tradeAuthority','Authority required');ok=false;} if(captchaInput.value.toUpperCase()!=cap){err('captchaInput','Captcha mismatch');ok=false;} if(!beneficiaryConfirmation.checked) ok=false; if(!ok){statusMsg('Please correct highlighted fields.','bad');return;} statusMsg('Submitting information...','info');
const payload={referenceCode:ReferenceCode.value,customerName:custName.value,customerEmail:custemail.value,contactNumber:contactNumber.value,tin:tin.value,trn:trn.value,tradeLicenceNumber:tradeLicenceNumber.value,tradeAuthority:tradeAuthority.value,freeZoneCustomer:freeZoneCustomer.checked,address1:address1.value,address2:address2.value,address3:address3.value,emirate:emirate.value,beneficiaryConfirmation:beneficiaryConfirmation.checked,submittedOn:new Date().toISOString()};
try{let r=await fetch(flowUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); if(!r.ok) throw 0; statusMsg('Thank you. Information submitted successfully.','ok'); generateCaptcha();}catch{x=statusMsg('Submission failed. Please try again.','bad');}}
);
</script></body></html>
